<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Музыкальный Конструктор Жанров</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0c10; color: #c5c6c7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1f2833; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); width: 600px; border: 2px solid #45f3ff; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #45f3ff; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { color: #66fcf1; font-size: 13px; margin-bottom: 25px; }
        .input-group { display: flex; gap: 12px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; background: #0b0c10; border: 2px solid #45f3ff; padding: 14px 20px; color: #fff; border-radius: 8px; font-size: 16px; outline: none; }
        button { background: #45f3ff; color: #0b0c10; border: none; padding: 0 35px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        button.playing { background: #ff4a4a; color: #fff; }
        .monitor-panel { background: #0b0c10; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-family: monospace; font-size: 14px; color: #66fcf1; text-align: left; }
        .monitor-line { margin: 8px 0; display: flex; justify-content: space-between; }
        .monitor-val { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Музыкальный Конструктор Жанров</h1>
    <div class="subtitle">Вписывайте любые свои жанры, стили или поджанры через запятую</div>
    
    <div class="input-group">
        <input type="text" id="genreInput" placeholder="Например: Поп, Рок, Электроника..." value="Поп">
        <button id="playBtn">PLAY</button>
    </div>

    <div class="monitor-panel">
        <div class="monitor-line"><span>Форма звуковой волны:</span> <span id="monWave" class="monitor-val">-</span></div>
        <div class="monitor-line"><span>Темп скорости (BPM):</span> <span id="monBpm" class="monitor-val">-</span></div>
        <div class="monitor-line"><span>Эффект искажения:</span> <span id="monDist" class="monitor-val">-</span></div>
    </div>
</div>

<script>
    var audioCtx = null;
    var isPlaying = false;
    var timerId = null;
    var noteIndex = 0;
    var settings = { wave: 'sine', bpm: 120, dist: 0 };

    var inputEl = document.getElementById('genreInput');
    var btnEl = document.getElementById('playBtn');

    function parseText() {
        var text = inputEl.value.toLowerCase().trim();
        if (!text) return;

        var code = 0;
        for (var i = 0; i < text.length; i++) {
            code += text.charCodeAt(i);
        }

        var waves = ['sine', 'triangle', 'sawtooth', 'square'];
        settings.wave = waves[code % 4];
        settings.bpm = 85 + (code % 100);
        settings.dist = (code % 3 === 0) ? (code % 200) + 50 : 0;

        var waveNames = { 'sine': 'Синусоида (Мягкая)', 'triangle': 'Треугольная (Инди/Фолк)', 'sawtooth': 'Пила (Электро/Синт)', 'square': 'Квадрат (Ретро/8-Bit)' };
        document.getElementById('monWave').textContent = waveNames[settings.wave];
        document.getElementById('monBpm').textContent = settings.bpm + ' BPM';
        document.getElementById('monDist').textContent = settings.dist > 0 ? 'Включен' : 'Выключен';

        if (isPlaying) {
            clearInterval(timerId);
            timerId = setInterval(playStep, (60000 / settings.bpm) / 2);
        }
    }

    inputEl.addEventListener('input', parseText);

    btnEl.addEventListener('click', function() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (isPlaying) {
            isPlaying = false;
            btnEl.textContent = 'PLAY';
            btnEl.classList.remove('playing');
            clearInterval(timerId);
        } else {
            isPlaying = true;
            btnEl.textContent = 'STOP';
            btnEl.classList.add('playing');
            parseText();
            timerId = setInterval(playStep, (60000 / settings.bpm) / 2);
        }
    });

    function playStep() {
        if (!audioCtx || !isPlaying) return;
        var notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
        var freq = notes[noteIndex % notes.length];
        noteIndex++;

        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = settings.wave;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

        if (settings.dist > 0) {
            var distNode = audioCtx.createWaveShaper();
            distNode.curve = makeDistCurve(settings.dist);
            osc.disconnect(gain);
            osc.connect(distNode);
            distNode.connect(gain);
        }

        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    }

    function makeDistCurve(amount) {
        var k = amount, n = 44100, curve = new Float32Array(n), deg = Math.PI / 180, i = 0, x;
        for ( ; i < n; ++i ) {
            x = (i * 2) / n - 1;
            curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
        }
        return curve;
    }

    parseText();
</script>

</body>
</html>
