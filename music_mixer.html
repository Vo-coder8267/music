<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Магический Гримуар Жанров</title><style>body{font-family:'Georgia',serif;background:#1a120b;color:#f5ebe0;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background-image:radial-gradient(circle,#2c1e15 20%,#120a06 80%)}.container{background:#2c1c12;padding:40px;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,0.9);width:680px;border:3px double #d4af37;text-align:center}h1{font-size:24px;margin:0 0 5px 0;color:#d4af37;text-transform:uppercase}subtitle{color:#a9927d;font-size:13px;font-style:italic;display:block;margin-bottom:30px}.input-group{display:flex;gap:12px;margin-bottom:25px}input{flex:1;background:#1e110a;border:1px solid #8b5a2b;padding:15px 22px;color:#f5ebe0;border-radius:4px;font-size:16px;outline:none}button{background:linear-gradient(to bottom,#8b2635,#551622);color:#f5ebe0;border:1px solid #d4af37;padding:0 40px;font-size:16px;font-weight:bold;border-radius:4px;cursor:pointer}button.playing{background:linear-gradient(to bottom,#2a7b4c,#164e2f)}.panel{background:#1e110a;padding:20px;border-radius:6px;margin-bottom:20px;font-family:monospace;font-size:14px;color:#d4af37;text-align:left;border:1px solid #8b5a2b}.line{margin:8px 0;display:flex;justify-content:space-between}.val{color:#f5ebe0;font-weight:bold}</style></head><body><div class="container"><h1>📜 Магический Гримуар Жанров</h1><subtitle>Смешайте древние свитки, поджанры и заклинания через запятую</subtitle><div class="input-group"><input type="text" id="genreInput" value="techno"><button id="playBtn">PLAY</button></div><div class="panel"><div class="line"><span>Ритуал ритма (Ударные):</span> <span id="outDrums" class="val">-</span></div><div class="line"><span>Гул земли (Bass Line):</span> <span id="outBass" class="val">-</span></div><div class="line"><span>Голос стихий (Инструменты):</span> <span id="outMelody" class="val">-</span></div><div class="line"><span>Чары и аура (Спецэффекты):</span> <span id="outFX" class="val">-</span></div><div class="line"><span>Скорость пульсации (BPM):</span> <span id="outBpm" class="val">-</span></div></div></div><script>var audioCtx=null,isPlaying=false,mainTimer=null,currentStep=0,bpm=120,wave='sine',kick=false,snare=false,hats=false,cowbell=false,dist=false,echo=false,hum=false;var inp=document.getElementById('genreInput'),btn=document.getElementById('playBtn');function mix(){var t=inp.value.toLowerCase();bpm=120;wave='sine';kick=snare=hats=cowbell=dist=echo=hum=false;if(t.includes('house')||t.includes('хаус')){bpm=125;kick=true;snare=true;wave='triangle'}if(t.includes('deep house')){bpm=116;echo=true;wave='sine'}if(t.includes('techno')||t.includes('техно')){bpm=135;kick=true;hats=true;wave='sawtooth'}if(t.includes('drift phonk')){bpm=155;cowbell=true;dist=true;kick=true}if(t.includes('metal')||t.includes('metal')||t.includes('рок')||t.includes('rock')){bpm=140;kick=true;snare=true;dist=true;wave='sawtooth'}if(t.includes('drone')||t.includes('дрон')){hum=true;kick=false}document.getElementById('outDrums').textContent=kick?"Плотный ритуальный бой бочки":"Тишина (Медитация)";document.getElementById('outBass').textContent=wave==='sine'?"Низкий гул подземелья (Суб-бас)":"Тяжелый металлический скрежет";document.getElementById('outMelody').textContent=cowbell?"Чарующий ритуальный звон ковбелла":"Древний перебор лютни / Аккорды";document.getElementById('outFX').textContent=dist?"Стена шума / Искажение заклинания":"Эхо в катакомбах / Объемная аура";document.getElementById('outBpm').textContent=bpm+" ударов";if(isPlaying){clearInterval(mainTimer);mainTimer=setInterval(step,(60000/bpm)/2)}}inp.addEventListener('input',mix);btn.addEventListener('click',function(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}if(isPlaying){isPlaying=false;btn.textContent='PLAY';btn.classList.remove('playing');clearInterval(mainTimer)}else{isPlaying=true;btn.textContent='STOP';btn.classList.add('playing');mix();mainTimer=setInterval(step,(60000/bpm)/2)}});function step(){if(!audioCtx||!isPlaying)return;var t=[130.81,146.83,164.81,196,220,261.63,293.66,329.63];var e=t[currentStep%t.length];if(hum&&currentStep%4===0){tone(65.41,'sine',1.4,0.16,false)}if(!hum){if(cowbell){tone(e*1.5,'square',0.12,0.18,false)}else{tone(e,wave,0.38,0.08,dist)}}if(kick&&currentStep%2===0){drum(140,0.28)}if(snare&&currentStep%4===2){drum(260,0.16)}if(hats&&currentStep%2===1){drum(9500,0.02)}currentStep++}function tone(t,e,c,n,i){var a=audioCtx.createOscillator(),r=audioCtx.createGain();a.type=e;a.frequency.setValueAtTime(t,audioCtx.currentTime);r.gain.setValueAtTime(0,audioCtx.currentTime);r.gain.linearRampToValueAtTime(n,audioCtx.currentTime+0.05);r.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+c);if(echo){var o=audioCtx.createDelay(),s=audioCtx.createGain();o.delayTime.value=0.35;s.gain.value=0.45;a.connect(r);r.connect(o);o.connect(s);s.connect(o);o.connect(audioCtx.destination)}if(i){var u=audioCtx.createWaveShaper();u.curve=distC(380);a.connect(u);u.connect(r)}else{a.connect(r)}r.connect(audioCtx.destination);a.start();a.stop(audioCtx.currentTime+c)}function drum(t,e){var c=audioCtx.createOscillator(),n=audioCtx.createGain();c.connect(n);n.connect(audioCtx.destination);c.frequency.setValueAtTime(t,audioCtx.currentTime);c.frequency.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);n.gain.setValueAtTime(e,audioCtx.currentTime);n.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.15);c.start();c.stop(audioCtx.currentTime+0.15)}function distC(t){var e=t,c=44100,n=new Float32Array(c),i=Math.PI/180,a=0,r;for(;a<c;++a){r=a*2/c-1;n[a]=(3+e)*r*12*i/(Math.PI+e*Math.abs(r))}return n}mix();</script></body></html>
