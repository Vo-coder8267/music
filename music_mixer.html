<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Энциклопедия Музыкальных Жанров — Аудио-Конструктор</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0c0f12; color: #c5d1db; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #161b22; padding: 40px; border-radius: 16px; box-shadow: 0 25px 70px rgba(0,0,0,0.7); width: 680px; border: 1px solid #45f3ff; text-align: center; }
        h1 { font-size: 22px; margin-bottom: 5px; color: #45f3ff; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: #66fcf1; font-size: 13px; margin-bottom: 30px; }
        .input-group { display: flex; gap: 12px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; background: #0c0f12; border: 2px solid #30363d; padding: 15px 22px; color: #fff; border-radius: 8px; font-size: 16px; outline: none; transition: 0.3s; }
        input[type="text"]:focus { border-color: #45f3ff; }
        button { background: #45f3ff; color: #0c0f12; border: none; padding: 0 40px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:hover { background: #66fcf1; transform: scale(1.02); }
        button.playing { background: #ff4a4a; color: #fff; }
        .panel { background: #0c0f12; padding: 20px; border-radius: 10px; margin-bottom: 20px; font-family: monospace; font-size: 14px; color: #66fcf1; text-align: left; border: 1px solid #30363d; }
        .panel-title { color: #45f3ff; font-weight: bold; margin-bottom: 12px; border-bottom: 1px dashed #30363d; padding-bottom: 5px; text-transform: uppercase; font-size: 12px; }
        .line { margin: 8px 0; display: flex; justify-content: space-between; }
        .val { color: #fff; font-weight: bold; }
        .tags-holder { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; min-height: 35px; }
        .tag { background: #21262d; color: #45f3ff; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; border: 1px solid #30363d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Генератор Энциклопедии Жанров</h1>
    <div class="subtitle">Смешивайте любые поджанры и стили из вашей базы данных через запятую</div>
    
    <div class="input-group">
        <input type="text" id="genreInput" placeholder="Например: Deep House, Drift Phonk, DSBM, Harsh Noise..." value="Deep House, Trap">
        <button id="playBtn">PLAY</button>
    </div>

    <div class="tags-holder" id="tagsHolder"></div>

    <div class="panel">
        <div class="panel-title">📡 Мониторинг аудио-синтеза аранжировки:</div>
        <div class="line"><span>Структура ритма (Ударные):</span> <span id="outDrums" class="val">-</span></div>
        <div class="line"><span>Плотность баса (Bass Line):</span> <span id="outBass" class="val">-</span></div>
        <div class="line"><span>Текстурные инструменты:</span> <span id="outMelody" class="val">-</span></div>
        <div class="line"><span>Звуковые спецэффекты:</span> <span id="outFX" class="val">-</span></div>
        <div class="line"><span>Рассчитанный темп (BPM):</span> <span id="outBpm" class="val">-</span></div>
    </div>
</div>

<script>
    var audioCtx = null;
    var isPlaying = false;
    var mainTimer = null;
    var currentStep = 0;

    var currentBpm = 120;
    var currentInstrument = 'sine';
    var hasKick = false;
    var hasSnare = false;
    var hasHiHats = false;
    var hasCowbell = false;
    var hasDistortion = false;
    var hasLoFiNoise = false;
    var hasDeepEcho = false;
    var hasDroneHum = false;

    var inputEl = document.getElementById('genreInput');
    var btnEl = document.getElementById('playBtn');
    var tagsHolder = document.getElementById('tagsHolder');
        function parseGenreDatabase() {
        var text = inputEl.value.toLowerCase();
        tagsHolder.innerHTML = '';

        currentBpm = 120; currentInstrument = 'sine'; hasKick = false; hasSnare = false;
        hasHiHats = false; hasCowbell = false; hasDistortion = false; hasLoFiNoise = false;
        hasDeepEcho = false; hasDroneHum = false;

        function createTag(name) {
            var el = document.createElement('span');
            el.className = 'tag';
            el.textContent = '🔮 ' + name;
            tagsHolder.appendChild(el);
        }

        // --- ЭЛЕКТРОННАЯ МУЗЫКА ---
        if (text.includes('house') || text.includes('хаус')) { currentBpm = 125; hasKick = true; hasSnare = true; currentInstrument = 'triangle'; }
        if (text.includes('deep house')) { currentBpm = 116; hasDeepEcho = true; currentInstrument = 'sine'; createTag('Deep House'); }
        if (text.includes('tech house')) { currentBpm = 126; hasHiHats = true; createTag('Tech House'); }
        if (text.includes('acid house')) { currentBpm = 128; currentInstrument = 'sawtooth'; hasDistortion = true; createTag('Acid House 303'); }
        if (text.includes('outsider house') || text.includes('lo-fi house')) { hasLoFiNoise = true; hasDistortion = true; createTag('Outsider Lo-Fi House'); }
        if (text.includes('techno') || text.includes('техно')) { currentBpm = 135; hasKick = true; hasHiHats = true; currentInstrument = 'sawtooth'; }
        if (text.includes('minimal techno')) { currentBpm = 128; hasKick = true; hasHiHats = false; hasSnare = false; createTag('Minimal Techno'); }
        if (text.includes('industrial techno')) { hasDistortion = true; hasSnare = true; currentBpm = 140; createTag('Industrial Techno'); }
        if (text.includes('dub techno')) { hasDeepEcho = true; hasDroneHum = true; currentBpm = 120; createTag('Dub Techno'); }
        if (text.includes('drum & bass') || text.includes('jungle')) { currentBpm = 172; hasKick = true; hasHiHats = true; hasSnare = true; createTag('Drum & Bass'); }
        if (text.includes('liquid funk') || text.includes('liquid dnb')) { currentBpm = 165; hasDeepEcho = true; currentInstrument = 'sine'; createTag('Liquid Funk'); }
        if (text.includes('neurofunk')) { currentBpm = 175; hasDistortion = true; currentInstrument = 'sawtooth'; createTag('Neurofunk'); }
        if (text.includes('breakcore')) { currentBpm = 210; hasDistortion = true; hasSnare = true; hasHiHats = true; createTag('Breakcore'); }

        // --- РОК И ТЯЖЕЛЫЙ МЕТАЛ ---
        if (text.includes('rock') || text.includes('рок')) { currentBpm = 115; hasKick = true; hasSnare = true; currentInstrument = 'sawtooth'; }
        if (text.includes('blues rock')) { currentBpm = 95; currentInstrument = 'triangle'; hasDeepEcho = true; createTag('Blues Rock'); }
        if (text.includes('psychedelic rock')) { currentBpm = 100; hasDeepEcho = true; hasDroneHum = true; createTag('Psychedelic Rock'); }
        if (text.includes('punk rock')) { currentBpm = 165; hasDistortion = true; createTag('Punk Rock'); }
        if (text.includes('pop punk')) { currentBpm = 175; hasKick = true; hasSnare = true; createTag('Pop Punk'); }
        if (text.includes('crust punk')) { currentBpm = 220; hasDistortion = true; hasKick = true; createTag('Crust Punk'); }
        if (text.includes('alternative rock') || text.includes('grunge') || text.includes('гранж')) { currentBpm = 100; hasDistortion = true; hasSnare = true; createTag('Alternative Grunge'); }
        if (text.includes('indie rock')) { currentBpm = 115; currentInstrument = 'triangle'; createTag('Indie Rock'); }
        if (text.includes('shoegaze')) { hasDeepEcho = true; hasDistortion = true; hasDroneHum = true; createTag('Shoegaze Noise Wall'); }
        if (text.includes('metal') || text.includes('метал') || text.includes('thrash metal')) { currentBpm = 150; hasKick = true; hasSnare = true; hasDistortion = true; createTag('Thrash Metal'); }
        if (text.includes('death metal')) { currentBpm = 160; hasDistortion = true; hasKick = true; createTag('Death Metal'); }
        if (text.includes('black metal')) { currentBpm = 180; hasDistortion = true; hasDroneHum = true; createTag('Black Metal'); }
        if (text.includes('dsbm')) { currentBpm = 75; hasDroneHum = true; hasDistortion = true; createTag('DSBM (Depressive Black)'); }
        if (text.includes('djent')) { currentBpm = 95; hasKick = true; hasDistortion = true; createTag('Djent Polyrythm'); }

        // --- ХИП-ХОП, РЭП И R&B ---
        if (text.includes('hip-hop') || text.includes('рэп') || text.includes('rap') || text.includes('boom bap')) { currentBpm = 90; hasKick = true; hasSnare = true; hasHiHats = true; currentInstrument = 'sine'; createTag('Boom Bap OldSchool'); }
        if (text.includes('trap') || text.includes('трэп')) { currentBpm = 145; hasKick = true; hasHiHats = true; currentInstrument = 'sine'; createTag('Trap 808 Bass'); }
        if (text.includes('drill') || text.includes('дрил')) { currentBpm = 140; hasKick = true; hasDroneHum = true; createTag('UK Drill'); }
        if (text.includes('drift phonk')) { currentBpm = 155; hasCowbell = true; hasDistortion = true; hasKick = true; createTag('Drift Phonk'); }
        if (text.includes('r&b') || text.includes('soul') || text.includes('contemporary r&b')) { currentBpm = 100; hasDeepEcho = true; currentInstrument = 'sine'; createTag('Contemporary R&B'); }
        if (text.includes('neo-soul')) { currentBpm = 85; currentInstrument = 'triangle'; hasDeepEcho = true; createTag('Neo-Soul'); }

        // --- ДЖАЗ, БЛЮЗ, ПОП, ФОЛК, КЛАССИКА И АВАНГАРД ---
        if (text.includes('jazz') || text.includes('джаз') || text.includes('swing')) { currentBpm = 150; currentInstrument = 'triangle'; hasHiHats = true; createTag('Jazz Swing'); }
        if (text.includes('bebop')) { currentBpm = 190; currentInstrument = 'triangle'; createTag('Bebop Speed'); }
        if (text.includes('modal jazz') || text.includes('smooth jazz')) { currentBpm = 95; hasDeepEcho = true; createTag('Smooth Modal Jazz'); }
        if (text.includes('gypsy jazz')) { currentBpm = 160; currentInstrument = 'triangle'; createTag('Gypsy Jazz Manouche'); }
        if (text.includes('free jazz')) { currentBpm = 170; hasDistortion = true; createTag('Free Jazz Chaos'); }
        if (text.includes('blues') || text.includes('блюз') || text.includes('delta blues') || text.includes('chicago blues')) { currentBpm = 80; currentInstrument = 'triangle'; hasDeepEcho = true; createTag('Blues Rhythm'); }
        if (text.includes('pop') || text.includes('поп') || text.includes('dance-pop')) { currentBpm = 120; hasKick = true; hasSnare = true; createTag('Dance-Pop'); }
        if (text.includes('k-pop')) { currentBpm = 130; hasKick = true; hasHiHats = true; hasSnare = true; createTag('K-Pop Dynamic'); }
        if (text.includes('art pop')) { currentBpm = 110; hasDeepEcho = true; hasDroneHum = true; createTag('Art Pop'); }
        if (text.includes('folk') || text.includes('фолк') || text.includes('indie folk') || text.includes('bluegrass')) { currentBpm = 100; currentInstrument = 'triangle'; createTag('Acoustic Folk'); }
        if (text.includes('pagan folk') || text.includes('nordic folk')) { currentBpm = 85; hasDroneHum = true; hasDeepEcho = true; createTag('Pagan Nordic Folk'); }
        if (text.includes('reggae') || text.includes('регги') || text.includes('dub') || text.includes('даб')) { currentBpm = 75; hasKick = true; hasDeepEcho = true; currentInstrument = 'sine'; createTag('Dub Reggae Loops'); }
        if (text.includes('classical') || text.includes('классика') || text.includes('baroque') || text.includes('romanticism') || text.includes('impressionism')) { currentBpm = 80; currentInstrument = 'sine'; hasDeepEcho = true; createTag('Academic Classical'); }
        if (text.includes('neoclassical') || text.includes('неоклассика') || text.includes('post-classical')) { currentBpm = 85; currentInstrument = 'sine'; hasDeepEcho = true; createTag('Neoclassical'); }
        if (text.includes('minimalism')) { currentBpm = 120; currentInstrument = 'sine'; hasDeepEcho = true; createTag('Minimalism Patters'); }
        if (text.includes('harsh noise')) { hasDistortion = true; hasLoFiNoise = true; currentBpm = 160; createTag('Harsh Noise Wall'); }
        if (text.includes('drone') || text.includes('дрон')) { hasDroneHum = true; hasKick = false; hasSnare = false; createTag('Drone Textures'); }
        if (text.includes('cinematic') || text.includes('epic cinematic')) { currentBpm = 90; hasKick = true; hasDeepEcho = true; hasDroneHum = true; createTag('Epic Cinematic'); }
        document.getElementById('outDrums').textContent = hasKick ? (currentBpm > 165 ? "Экстремально быстрый бласт-бит / Перебивки" : "Плотный качающий ритм (Прямой/Ломаный)") : "Отсутствует (Акустика/Эмбиент)";
        document.getElementById('outBass').textContent = currentInstrument === 'sine' ? "Глубокий суб-бас (808 / Уличный аналог)" : "Гитарный / Плотный перегруженный бас";
        document.getElementById('outMelody').textContent = hasCowbell ? "Ведущий Мемфис-Ковбелл (Cowbell Хук)" : (currentInstrument === 'sawtooth' ? "Синтезаторная пила / Электрогитарный рифф" : "Мягкие текстурные аккорды / Клавишные");
        document.getElementById('outFX').textContent = hasDistortion ? "Жесткий Дисторшн / Перегруз / Шум" : (hasDeepEcho ? "Пространственный космический реверб (Эхо)" : "Чистый студийный звук");
        document.getElementById('outBpm').textContent = currentBpm + " BPM";

        if (isPlaying) {
            clearInterval(mainTimer);
            mainTimer = setInterval(audioStep, (60000 / currentBpm) / 2);
        }
    }

    inputEl.addEventListener('input', parseGenreDatabase);

    btnEl.addEventListener('click', function() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (isPlaying) {
            isPlaying = false;
            btnEl.textContent = 'PLAY';
            btnEl.classList.remove('playing');
            clearInterval(mainTimer);
        } else {
            isPlaying = true;
            btnEl.textContent = 'STOP';
            btnEl.classList.add('playing');
            parseGenreDatabase();
            mainTimer = setInterval(audioStep, (60000 / currentBpm) / 2);
        }
    });

    function audioStep() {
        if (!audioCtx || !isPlaying) return;
        var scale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63];
        var freq = scale[currentStep % scale.length];

        if (hasDroneHum && currentStep % 4 === 0) {
            playAcousticTone(65.41, 'sine', 1.4, 0.16, false);
        }
        if (!hasDroneHum) {
            if (hasCowbell) {
                playAcousticTone(freq * 1.5, 'square', 0.12, 0.18, false);
            } else {
                playAcousticTone(freq, currentInstrument, 0.38, 0.08, hasDistortion);
            }
        }
        if (hasKick && currentStep % 2 === 0) { playDrumKick(); }
        if (hasSnare && (currentStep % 4 === 2)) { playDrumSnare(); }
        if (hasHiHats && currentStep % 2 === 1) { playHiHat(); }
        if (hasLoFiNoise && Math.random() > 0.4) { playHiHat(); }
        currentStep++;
    }

    function playAcousticTone(freq, type, duration, vol, distOn) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        if (hasDeepEcho) {
            var delay = audioCtx.createDelay();
            var feedback = audioCtx.createGain();
            delay.delayTime.value = 0.35;
            feedback.gain.value = 0.45;
            osc.connect(gain); gain.connect(delay); delay.connect(feedback); feedback.connect(delay); delay.connect(audioCtx.destination);
        }
        if (distOn) {
            var shaper = audioCtx.createWaveShaper();
            shaper.curve = makeDistortionCurve(380);
            osc.connect(shaper); shaper.connect(gain);
        } else {
            osc.connect(gain);
        }
        gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function playDrumKick() {
        var osc = audioCtx.createOscillator(); var gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

    function playDrumSnare() {
        var osc = audioCtx.createOscillator(); var gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(260, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.11);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.11);
        osc.start(); osc.stop(audioCtx.currentTime + 0.11);
    }

    function playHiHat() {
        var osc = audioCtx.createOscillator(); var gain = audioCtx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(9500, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function makeDistortionCurve(amount) {
        var k = amount, n = 44100, curve = new Float32Array(n), deg = Math.PI / 180, i = 0, x;
        for ( ; i < n; ++i ) {
            x = (i * 2) / n - 1; curve[i] = ((3 + k) * x * 12 * deg) / (Math.PI + k * Math.abs(x));
        }
        return curve;
    }

    parseGenreDatabase();
</script>
</body>
</html>
