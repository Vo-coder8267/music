<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Музыкальный Конструктор Жанров</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0c10; color: #c5c6c7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1f2833; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); width: 600px; border: 2px solid #45f3ff; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #45f3ff; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { color: #66fcf1; font-size: 13px; margin-bottom: 25px; }
        .input-group { display: flex; gap: 12px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; background: #0b0c10; border: 2px solid #45f3ff; padding: 14px 20px; color: #fff; border-radius: 8px; font-size: 16px; outline: none; }
        button { background: #45f3ff; color: #0b0c10; border: none; padding: 0 35px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        button.playing { background: #ff4a4a; color: #fff; }
        .monitor-panel { background: #0b0c10; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-family: monospace; font-size: 14px; color: #66fcf1; text-align: left; }
        .monitor-line { margin: 8px 0; display: flex; justify-content: space-between; }
        .monitor-val { color: #fff; font-weight: bold; }
        .loading-status { color: #ffc107; font-size: 12px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Музыкальный Конструктор Жанров</h1>
    <div class="subtitle">Вписывайте любые свои жанры, стили или поджанры через запятую</div>
    
    <div id="loadingStatus" class="loading-status">Загрузка живых инструментов... Пожалуйста, подождите.</div>

    <div class="input-group">
        <input type="text" id="genreInput" placeholder="Например: Поп, Рок, Электроника..." value="Поп">
        <button id="playBtn">PLAY</button>
    </div>

    <div class="monitor-panel">
        <div class="monitor-line"><span>Смешивание инструментов:</span> <span id="monMix" class="monitor-val">-</span></div>
        <div class="monitor-line"><span>Акустическая гитара (Рок/Фолк):</span> <span id="monGuitar" class="monitor-val">Выкл</span></div>
        <div class="monitor-line"><span>Глубокий бас (Андеграунд):</span> <span id="monBass" class="monitor-val">Выкл</span></div>
        <div class="monitor-line"><span>Ударные (Техно/Поп бит):</span> <span id="monDrums" class="monitor-val">Выкл</span></div>
    </div>
</div>

<script>
    var audioCtx = null;
    var isPlaying = false;
    
    // Ссылки на реальные живые студийные аудио-петли (короткие бесшовные треки)
    var sampleUrls = {
        drums: 'https://google.com', // Заглушка бита (заменится на аудио поток)
        guitar: 'https://sampleswap.org[80]acoustic-strumming-E.mp3',
        synth: 'https://sampleswap.org[120]bright-pop-synth-theme.mp3',
        bass: 'https://sampleswap.org[125]low-subby-bass-loop.mp3'
    };

    var buffers = {};
    var sources = {};
    var gainNodes = {};

    var inputEl = document.getElementById('genreInput');
    var btnEl = document.getElementById('playBtn');
    var loadingEl = document.getElementById('loadingStatus');

    // Хэш-функция для разбора текста
    function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash |= 0;
        }
        return Math.abs(hash);
    }

    // Загрузка аудиофайла в память браузера
    async function loadSample(name, url) {
        try {
            var response = await fetch(url);
            var arrayBuffer = await response.arrayBuffer();
            buffers[name] = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) {
            console.error("Ошибка загрузки инструмента: " + name, e);
        }
    }

    async function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            loadingEl.style.display = 'block';
            
            // Загружаем все живые звуки одновременно
            await Promise.all([
                loadSample('guitar', sampleUrls.guitar),
                loadSample('synth', sampleUrls.synth),
                loadSample('bass', sampleUrls.bass)
            ]);
            
            loadingEl.style.display = 'none';
        }
    }

    function parseTextAndMix() {
        var text = inputEl.value.toLowerCase().trim();
        if (!text) return;

        var code = hashCode(text);

        // На основе букв вашего жанра динамически вычисляем громкость каждого живого инструмента
        var mixSettings = {
            guitar: (code % 2 === 0 || text.includes('рок') || text.includes('рок') || text.includes('folk') || text.includes('guitar')) ? 0.7 : 0.0,
            synth: (code % 3 === 0 || text.includes('поп') || text.includes('pop') || text.includes('электро')) ? 0.6 : 0.2,
            bass: (code % 5 === 0 || text.includes('дарк') || text.includes('bass') || text.includes('низк') || text.includes('метал')) ? 0.8 : 0.1
        };

        // Обновляем монитор на экране
        document.getElementById('monGuitar').textContent = mixSettings.guitar > 0 ? "ВКЛ (Громкость: " + Math.round(mixSettings.guitar*100) + "%)" : "Выкл";
        document.getElementById('monBass').textContent = mixSettings.bass > 0 ? "ВКЛ (Громкость: " + Math.round(mixSettings.bass*100) + "%)" : "Выкл";
        document.getElementById('monMix').textContent = "Живой микс собран!";

        // Если музыка играет прямо сейчас, мгновенно меняем баланс громкости живых инструментов
        if (isPlaying) {
            for (var key in mixSettings) {
                if (gainNodes[key]) {
                    gainNodes[key].gain.setValueAtTime(mixSettings[key], audioCtx.currentTime);
                }
            }
        }
        
        return mixSettings;
    }

    function startLoop(name, buffer, volume) {
        if (!buffer) return;
        
        // Создаем источник звука
        var source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.loop = true; // Делаем аудио-петлю бесконечной

        // Создаем регулятор громкости
        var gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);

        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        source.start(0);

        sources[name] = source;
        gainNodes[name] = gainNode;
    }

    btnEl.addEventListener('click', async function() {
        await initAudio();

        if (isPlaying) {
            isPlaying = false;
            btnEl.textContent = 'PLAY';
            btnEl.classList.remove('playing');
            
            // Останавливаем все живые треки
            for (var key in sources) {
                if (sources[key]) sources[key].stop();
            }
            sources = {};
            gainNodes = {};
        } else {
            isPlaying = true;
            btnEl.textContent = 'STOP';
            btnEl.classList.add('playing');
            
            var currentMix = parseTextAndMix();

            // Запускаем одновременное бесшовное звучание живых аудио-петель
            startLoop('guitar', buffers['guitar'], currentMix.guitar);
            startLoop('synth', buffers['synth'], currentMix.synth);
            startLoop('bass', buffers['bass'], currentMix.bass);
        }
    });

    inputEl.addEventListener('input', function() {
        if (audioCtx) parseTextAndMix();
    });
</script>

</body>
</html>
